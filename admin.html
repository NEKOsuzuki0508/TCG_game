<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TCG 管理者カード審査</title>
<link rel="stylesheet" href="assets/css/style.css">
<script defer src="config.js"></script><script defer src="assets/js/admin.js"></script>
<style>
.admin-wrap{max-width:900px;margin:40px auto;padding:20px}.admin-card{padding:18px;margin:14px 0;border:1px solid #38465b;border-radius:12px;background:#111b2a}.admin-card h3{margin-top:0}.admin-actions{display:flex;gap:10px;flex-wrap:wrap}.admin-login{max-width:440px}.admin-login label{display:block;margin:12px 0}.admin-login input{display:block;width:100%;padding:10px;margin-top:5px}.admin-muted{color:#9aa8bb;white-space:pre-wrap}.admin-error{color:#ff9a9a}
</style>
</head>
<body><main class="admin-wrap"><p class="eyebrow">TCG ADMINISTRATION</p><h1>カード公開審査</h1><p class="admin-muted">承認したカードだけが全プレイヤー共通の公開カード一覧に追加されます。</p>
<section id="login" class="admin-card admin-login"><h2>管理者ログイン</h2><form id="adminLogin"><label>管理者ID<input name="id" autocomplete="username" required></label><label>パスワード<input name="password" type="password" autocomplete="current-password" required></label><button class="primary-btn" type="submit">ログイン</button></form></section>
<section id="dashboard" hidden><div class="admin-actions"><button id="refresh" class="primary-btn">審査待ちを更新</button><button id="logout" class="small-outline">ログアウト</button></div><div id="status" class="admin-muted"></div><div id="pending"></div></section>
</main>
<footer class="site-footer">
  <p>© 2026 010301 — Original Game &amp; Characters</p>
  <p>© 2026 NEKOsuzuki0508 — Website Development</p>
</footer>
</body></html>
