 dmg=Math.max(0,dmg);if(dmg){let hp=target.hp;updateHp(target,-dmg);log(`${reason}：${target.name}に${dmg}ダメージ（${hp}→${target.hp}）`)}return dmg}
// 非同期防御選択：軽甲/重甲の両方があれば、防御側の人間に選ばせる。
async function chooseArmor(h,damage){if(!h.armor.light&&!h.armor.heavy)return null;
 if(h.armor.light&&!h.armor.heavy)return 'light';if(!h.armor.light&&h.armor.heavy)return 'heavy';
 if(game.mode==='ai'&&ownerOf(h)===1)return damage<=15?'light':'heavy';
 if(h.armorPref!=='auto')return h.armorPref;
 return await new Promise(resolve=>{armoredResolver=resolve;game.pendingArmor={uid:h.uid,name:h.name,damage,side:ownerOf(h)};render()})}
function applyDefencesSync(attacker,target,damage,reason){if(target.shieldTurn===game.turn){log(`${target.name}は「まほうの甲冑」で無効化`);return 0}if(target.nextHalf>0){target.nextHalf--;damage=Math.ceil(damage/2)}if(target.nextIn.length){damage=Math.max(0,damage-target.nextIn.shift())}return damage}
async function damage(actor,target,power,bonusTrue=0,options={}){
 if(!target||target.hp<=0)return 0;let side=ownerOf(actor);let originalTarget=target;
 if(options.redirect!==false)target=tryRedirect(actor,target);
 if(!target||target.hp<=0)return 0;
 let bonus=rawAttackBonus(actor,target,side);
 // 基本ルール：攻撃威力がぼうぎょ値以下なら、ぼうぎょを無視した確定10ダメージ。
 // ただし「攻撃を完全に防ぐ」効果がなければ、装甲などの数値軽減後も最低10を保証する。
 const attackPower=power+bonus, defensePower=stat(target,'defense');
 const minimumHit=!options.trueOnly && attackPower<=defensePower;
 let base=options.trueOnly?0:(minimumHit?10:attackPower-defensePower);
 if(minimumHit)log(`最低ダメージ保証：${actor.name}の攻撃威力${attackPower} ≦ ${target.name}のぼうぎょ${defensePower} → 確定10ダメージ（完全無効化以外は軽減後も保証）`);
 let amount=base+bonusTrue; if(options.trueOnly)amount=bonusTrue;
 game.players[side].attacks++;
 // 「確定10」は最終的な最低保証。ぼうぎょ以外の数値軽減でも0にはならない。
 // ただし「攻撃そのものを防ぐ」完全無効化（まほうの甲冑）は別扱い。
 // 確定追加ダメージは別に加算し、通常の軽減処理を経てから最低保証を適用する。
 const completelyBlocked=target.shieldTurn===game.turn;
 amount=applyDefencesSync(actor,target,amount,options.name||'攻撃');
 if(amount>0&&(target.armor.light||target.armor.heavy)){
   let k=await chooseArmor(target,amount);
   if(k&&target.armor[k]){target.armor[k]=false;amount=Math.max(0,amount-(k==='light'?15:35));log(`防御：${target.name}の${k==='light'?'軽甲':'重甲'}が消費された`);onArmorSpent(target,k)}
 }
 // 市販結界装置：次に受ける攻撃を1回防ぐ。やみカード使用の技は半減にとどまる。
 let barrierBlocked=false;
 if(!completelyBlocked&&(target.nextBarrier||0)>0){
   target.nextBarrier--;
   const dark=!!(actor&&HERO_MAP[actor.id]?.skills?.some(sk=>sk.name===options.name&&sk.special?.includes('やみ')));
   if(dark){amount=Math.ceil(amount/2);log(`防御：${target.name}の市販結界装置がやみ攻撃を半減`)}
   else{amount=0;barrierBlocked=true;log(`防御：${target.name}の市販結界装置が攻撃を完全に防いだ`)}
 }
 if(minimumHit&&!completelyBlocked&&!barrierBlocked&&amount<10){
   log(`確定10保証：${target.name}への軽減後ダメージ${amount} → 10（完全無効化以外では残る）`);
   amount=10;
 }
 if(target.hp<=0)return 0;
 let before=target.hp;updateHp(target,-amount);
 log(`${actor.name}「${options.name||'攻撃'}」→ ${target.name}：${amount}ダメージ（${before}→${target.hp}）`);
 if(target.sleep&&amount>0){target.sleep=0;log(`${target.name}のねむりが解除された`)}
 if(amount>0){target.flags.attackedTurn=game.turn;
   // 攻撃から派生する被弾・反撃を処理（追撃が反撃を再誘発しない）
   for(let h of field(ownerOf(target))){
     if(h.id===1006&&claim(h,'shielded_'+target.uid))buff(target,'defense',10,1);
     if(h.id===1010&&claim(h,'aid'))heal(target,10);
   }
   if(target.flags.counterReady){target.flags.counterReady=false;counter(target,actor,20,'反撃の準備')}
   for(let h of field(ownerOf(target)))if(h.id===1007&&claim(h,'counter'))counter(h,actor,20,'応報の刃');
   if(actor.id===1018)buff(target,'attack',-10,1);
 }
 // 多段追撃の実行（ここでのダメージは攻撃回数に含めない）
 if(options.normal&&amount>0){
   if(actor.id===1002){} // ミヤは後述の味方通常攻撃誘発で実行
   if(actor.id===1014&&actor.armor.light&&claim(actor,'scatter')){let a=enemyAdjacent(target);if(a.length)directDamage(actor,a[0],15,'機動射角',true)}
   for(let h of field(side))if(h.id===1002&&claim(h,'magNormal')&&roll(.5))magnet(target,1);
 }
 if(game.players[side].attacks>=2){for(let h of field(side))if(h.id===1034&&claim(h,'comboHeal'))heal(mostWounded(side),10)}
 if(target.hp===0||originalTarget.hp===0)checkVictory();
 return amount;
}
function counter(h,enemy,amount,name){if(!enemy||enemy.hp<=0)return;let dmg=amount; game.counterThisTurn[ownerOf(h)]++;
 log(`反撃：${h.name}「${name}」`);directDamage(h,enemy,dmg,name,false);
 for(let x of field(ownerOf(h)))if(x.id===1008&&claim(x,'counterPursuit'))directDamage(x,enemy,10,'仕返しの照準',false)}
function frontSkillCost(side,skill){let p=game.players[side];return Math.max(0,skill.cost+p.mpMod)}
function getPayment(side,skill){let hand=game.players[side].hand,usedSpecial=[];for(let sp of skill.special){let idx=hand.findIndex((v,i)=>!usedSpecial.includes(i)&&v===sp+'カード');if(idx===-1)return null;usedSpecial.push(idx)}
 let need=frontSkillCost(side,skill);
 let mp=hand.map((v,i)=>({i,v:parseInt(v)||0})).filter(x=>x.v>0&&!usedSpecial.includes(x.i));
 let states=new Map([[0,[]]]),maxSum=need+3;
 for(let card of mp){let next=new Map(states);for(let [sum,idx] of states){let total=sum+card.v;if(total>maxSum)continue;let found=next.get(total);let candidate=idx.concat(card.i);if(!found||candidate.length<found.length)next.set(total,candidate)}states=next}
 let best=null;for(let [sum,idx] of states){if(sum<need)continue;if(!best||sum<best.sum||(sum===best.sum&&idx.length<best.idx.length))best={sum,idx}}

 return best?usedSpecial.concat(best.idx):null}
function consume(side,payment){let p=game.players[side];payment.slice().sort((a,b)=>b-a).forEach(i=>p.discard.push(...p.hand.splice(i,1)));}

function pickAiLineup(side){let p=game.players[side];let prev=p.field, c=alive(side).slice();return c.sort((a,b)=>((prev.includes(b.uid)?20:0)+b.hp/8+stat(b,'speed')/3)-((prev.includes(a.uid)?20:0)+a.hp/8+stat(a,'speed')/3)).slice(0,3).map(h=>h.uid)}

function beginTurn(){game.phase='acting';for(let s=0;s<2;s++){let p=game.players[s],old=p.field.slice();p.field=game.planned[s].slice();for(let h of field(s))if(!old.includes(h.uid))onEnter(h)}

function availableActors(){return [0,1].flatMap(s=>field(s).filter(h=>!h.acted).map(h=>({side:s,unit:h})))}
function nextActor(){if(game.phase==='ended')return;if(checkVictory())return;let all=availableActors();if(!all.length){endRound();return}
 const maximum=Math.max(...all.map(a=>stat(a.unit,'speed'))),high=all.filter(a=>stat(a.unit,'speed')===maximum);let chosen=high[rand(high.length)];
 let h=chosen.unit,s=chosen.side;

 game.current={side:s,uid:h.uid};selected=null;render();persist();

 }
function endRound(){for(let s=0;s<2;s++){let p=game.players[s];for(let h of p.team)h.buffs=h.buffs.filter(b=>b.until>game.turn)}
 // 戦闘終了条件：そのターン終了時、フィールド上の味方が全員倒れていた側が敗北。
 let lose0=game.planned[0].every(uid=>game.players[0].team.find(h=>h.uid===uid)?.hp<=0),lose1=game.planned[1].every(uid=>game.players[1].team.find(h=>h.uid===uid)?.hp<=0);if(lose0||lose1){finish(lose0&&lose1?-1:lose0?1:0);return}
 beginRound();render()}
async function takeAiAction(){if(!game||game.phase!=='acting'||!game.current||game.current.side!==1||waiting)return;

 let skills=HERO_MAP[h.id].skills;let candidates=skills.map((s,i)=>({s,i,p:getPayment(1,s)})).filter(x=>x.p && (TARG[h.id]||x.s.effect?.type!=='manual'));
 let healing=candidates.filter(x=>/(回復|処置|整備スプレー|修繕|物資運搬|編隊補給|補給ルート|快速装着|軽甲再編)/.test(x.s.name));

 let targ=chosen?(TARG[h.id]?.[chosen.i]||chosen.s.target||'enemy'):'enemy', pool=targ==='ally'?field(1):targ==='self'?[h]:field(0);
 let t=(targ==='none'?null:targ==='ally'?(pool.slice().sort((a,b)=>(b.maxHp-b.hp)-(a.maxHp-a.hp))[0]):pool.slice().sort((a,b)=>a.hp-b.hp)[0]);
 if(!t&&targ!=='none'){chosen=null;t=field(0)[0]}

 }

 return `<section class="hero-banner"><p class="eyebrow">TACTICAL CARD ARENA · CUSTOM CARDS · 6 FORMATIONS</p><h1>カードを組んで、<br><span>盤面を制圧せよ。</span></h1><p>公式91人と非公式36人に加え、カードを自由に登録できる、ブラウザで遊べる非公式TCG。6人で編成し、毎ターン3人まで出場させて対戦します。</p><div class="banner-pills"><span>${CARD_DATA.length}キャラクター</span><span>追加カード編集</span><span>60枚デッキ自由編成</span><span>AI / 同端末対戦</span></div></section>
 <div class="setup-grid"><section class="panel"><div class="section-top"><div><p class="eyebrow">MODE SELECT</p><h2>対戦形式</h2></div></div><div class="mode-tabs"><button data-act="mode" data-val="ai" class="${config.mode==='ai'?'on':''}"><b>AI対戦</b><small>相手が自動で行動</small></button><button data-act="mode" data-val="local" class="${config.mode==='local'?'on':''}"><b>2人対戦</b><small>同じ端末で交互操作</small></button></div>
 <div class="rules-mini"><b>バトルの流れ</b><p>編成 → フィールドに出す3人を決定 → すばやさ順に行動 → 技のMPを手札から支払う。敵6人を倒すか、敵の出場者をターン終了時に全滅させれば勝利。</p></div></section>
 ${[0,1].map(s=>`<section class="panel roster-config side${s}"><div class="section-top"><div><p class="eyebrow">${s===0?'PLAYER 01':'PLAYER 02'}</p><h2>${s===0?'青チーム':config.mode==='ai'?'AIチーム':'赤チーム'}</h2></div><span class="side-chip ${s?'red':'blue'}">${s?'RED':'BLUE'}</span></div><label class="field-label">編成を選択</label>${select(s)}<div class="roster-preview">${p[s].map(id=>`<span class="roster-mini" data-act="detail" data-id="${id}">${escapeHTML(HERO_MAP[id].name)}</span>`).join('')}</div><button class="line-btn" data-act="editor" data-side="${s}"><span>キャラクター6人を編集</span><span>→</span></button><div class="setup-deck-summary"><div><strong>${deckSlots[s]?'カスタム60枚デッキ':'自動作成デッキ'}</strong><small>${deckSlots[s]?'保存したカード構成で対戦':'チームの技に応じて自動生成'} </small></div><button class="small-outline" data-act="deckOpen" data-side="${s}">デッキ編成 →</button></div></section>`).join('')}
 </div><div class="start-area"><button class="primary-btn big" data-act="start">対戦を開始する <span>↗</span></button><p>インストール不要・オフライン動作。戦況はこのブラウザに自動保存されます。</p></div>`}
function rosterCheckCard(c,side){let checked=config.picks[side].includes(c.id);return `<button class="roster-card ${checked?'checked':''}" data-act="toggleHero" data-id="${c.id}" data-side="${side}" type="button"><span class="roster-id">No.${c.id}</span><b>${escapeHTML(c.name)}</b><small>${escapeHTML(c.archetype)}</small><span class="roster-check">${checked?'✓':'＋'}</span></button>`}
function renderEditor(){let side=config.editorSide;if(side===null)return '';return `<div class="veil"><section class="modal roster-editor"><div class="modal-title"><div><p class="eyebrow">CUSTOM FORMATION</p><h2>${sideLabel(side)}の編成変更</h2></div><button class="close-btn" data-act="closeEditor">×</button></div><p class="muted">任意のキャラクターを6人選択します。残り <b>${6-config.picks[side].length}</b> 人</p><div class="roster-filters"><input id="heroSearch" data-act="search" placeholder="キャラクターを検索" value="${escapeHTML(queryText)}"><select id="heroFilter" data-act="filter"><option value="all">すべての編成</option>${FORMATIONS.map(f=>`<option value="${f.key}" ${heroFilter===f.key?'selected':''}>${escapeHTML(f.name)}</option>`).join('')}</select></div><div class="roster-grid">${CARD_DATA.filter(h=>(heroFilter==='all'||FORMATIONS.find(f=>f.key===heroFilter).ids.includes(h.id))&&(!queryText||h.name.includes(queryText)||h.role.includes(queryText))).map(c=>rosterCheckCard(c,side)).join('')}</div><button class="primary-btn" data-act="closeEditor" ${config.picks[side].length!==6?'disabled':''}>編成を決定 (${config.picks[side].length}/6)</button></section></div>`}
function pickDefault(){if(!game)return [];const s=game.currentSelectSide;const prev=game.players[s].field.filter(u=>game.players[s].team.some(h=>h.uid===u&&h.hp>0));return prev.length?prev:alive(s).slice(0,3).map(h=>h.uid)}
function renderSelection(){let side=game.currentSelectSide;if(!plannedChoices.length)plannedChoices=pickDefault();let team=game.players[side].team;
 return `<div class="battle-topbar"><div><p class="eyebrow">TURN ${game.turn} · DEPLOYMENT PHASE</p><h2>出場するキャラクターを選択</h2></div><span class="turnbadge">第${game.turn}ターン</span></div>
 <div class="notice"><strong>${sideLabel(side)}の配置</strong><p>HPが残っているキャラクターを1～3人選択してください。両者の配置決定後、ターン開始の状態異常処理と行動順の決定が行われます。</p></div>
 <div class="selection-grid">${team.map(h=>`<div class="pick-wrap">${battleTile(h,side,'field')}<button class="pick-button ${plannedChoices.includes(h.uid)?'selected':''}" ${h.hp===0?'disabled':''} data-act="pick" data-uid="${h.uid}">${plannedChoices.includes(h.uid)?'✓ 出場':'＋ 出場させる'}</button></div>`).join('')}</div><div class="select-actions"><span>出場予定 <b>${plannedChoices.length}/3</b></span><button class="primary-btn" data-act="confirmLineup" ${!plannedChoices.length?'disabled':''}>この3人で確定 →</button></div>`}
function handCount(side){let p=game.players[side];return `<span>手札 ${p.hand.length}枚</span><span>山札 ${p.deck.length}枚</span><span>捨て札 ${p.discard.length}枚</span>`}
function renderBattle(){let side=game.mode==='ai'?0:(game.current?.side??0),enemy=1-side;let h=game.current?.side===side?game.players[side].team.find(x=>x.uid===game.current?.uid):null;let f0=field(side),f1=field(enemy);

 let htm=`<div class="battle-topbar"><div><p class="eyebrow">TACTICAL BATTLE · TURN ${game.turn}</p><h2>${sideLabel(side)}が行動中</h2></div><span class="turnbadge">第${game.turn}ターン</span></div>
 <div class="board-area"><div class="board-heading enemy"><div><small>OPPONENT</small><h3>${sideLabel(enemy)}</h3></div><span>${handCount(enemy)}</span></div><div class="battle-row enemy-row">${f1.length?f1.map(x=>battleTile(x,enemy)).join(''):'<div class="no-units">フィールドに生存者なし</div>'}${Array.from({length:Math.max(0,3-f1.length)},()=>'<div class="empty-slot">EMPTY</div>').join('')}</div>
 <div class="middle-strip"><span>▼ 戦闘エリア ▼</span><span>すばやさ順・1人ずつ行動</span></div>
 <div class="battle-row friendly-row">${f0.map(x=>battleTile(x,side)).join('')}${Array.from({length:Math.max(0,3-f0.length)},()=>'<div class="empty-slot">EMPTY</div>').join('')}</div><div class="board-heading friendly"><div><small>CURRENT PLAYER</small><h3>${sideLabel(side)}</h3></div><span>${handCount(side)}</span></div>
 </div>
 <div class="underboard"><div class="bench-box"><div class="boxheading"><h3>ベンチ</h3><span>次のターンに交代可能</span></div><div class="bench-list">${bench(side).map(x=>`<span data-act="detail" data-id="${x.id}">${escapeHTML(x.name)} <small>HP ${x.hp}</small></span>`).join('')||'<em>待機者なし</em>'}</div><div class="boxheading grave"><h3>墓場</h3><span>${game.players[side].team.filter(x=>x.hp<=0).map(x=>escapeHTML(x.name)).join('、')||'なし'}</span></div></div>
 <div class="action-box"><div class="boxheading"><h3>${h?'行動：'+escapeHTML(h.name):'相手の行動を処理中'}</h3><span>攻撃回数 ${game.players[side].attacks}</span></div>
 ${selected?`<div class="choose-target">${escapeHTML(selected.label)}：<strong>${selected.targetType==='enemy'?'上側の敵':'下側の味方'}をクリックして対象を指定してください</strong><button data-act="cancelTarget">取消</button></div>`:''}
 <div class="action-row"><button class="attack-btn" data-act="chooseNormal" ${!h||waiting?'disabled':''}><b>通常攻撃</b><small>${h&&((h.id>=1030&&h.id<=1035)||HERO_MAP[h.id]?.traitEffect==='triple35')?'35% × 3回':'MP不要 / 単体'}</small></button>${h?HERO_MAP[h.id].skills.map((sk,i)=>{let avail=!!getPayment(side,sk)&&!h.banSkills;return `<button class="skill-btn" data-act="chooseSkill" data-skill="${i}" ${avail&&!waiting?'':'disabled'}><b>${escapeHTML(sk.name)}</b><small>${escapeHTML(sk.costText||sk.cost+'MP')}${sk.special.map(x=>' + '+x).join('')} ${avail?'':'· コスト不足'}</small></button>`}).join(''):''}</div><div class="pass-line"><button data-act="openManualTools" ${!h||waiting?'disabled':''}>HP・状態異常などを手動調整</button><button data-act="passAction" ${!h||waiting?'disabled':''}>このキャラクターは行動しない（パス）</button></div>
 </div></div>
 <div class="hand-panel"><div class="boxheading"><h3>あなたの手札</h3><span>補助 ${game.players[side].assistUsed?'使用済み':'1枚使用可能'} / ターン</span></div><div class="hand-list">${game.players[side].hand.map((c,i)=>{let support=SUPPORTS.includes(c),disabled=game.players[side].assistUsed||waiting||game.current?.side!==side||(c==='まほうの甲冑'&&game.players[side].usedArmor);return `<button class="hand-card ${support?'support-card':'cost-card'}" ${support&&!disabled?`data-act="chooseAssist" data-name="${escapeHTML(c)}"`:''} ${support&&disabled?'disabled':''}><span>${support?'補助':'コスト'}</span><b>${escapeHTML(c)}</b>${support?`<small>${escapeHTML(HELP[c])}</small>`:`<small>${c.includes('MP')?'技の支払いに使用':'属性カード'}</small>`}</button>`}).join('')||'<div class="no-units">手札がありません</div>'}</div><p class="hand-footnote">技を選ぶと必要なコストカードが手札から自動選択・消費されます。補助カードは1ターンに1枚使用できます。</p></div>
 <div class="log-panel"><div class="boxheading"><h3>対戦ログ</h3><span>最新30件</span></div><div class="log-list">${game.log.slice(0,30).map(v=>`<p>${escapeHTML(v)}</p>`).join('')}</div></div>`;
 return htm+overlay+(passPending&&game.mode==='local'&&!game.pendingArmor?`<div class="veil high"><div class="modal handoff-modal"><span class="handoff-icon">⇄</span><p class="eyebrow">PASS THE DEVICE</p><h2>${sideLabel(side)}の番です</h2><p>端末を次のプレイヤーに渡してから表示してください。手札は次のプレイヤーだけが確認できます。</p><button class="primary-btn" data-act="resume">手札を表示して続ける</button></div></div>`:'')}
function renderVictory(){let win=game.winner;return `<section class="victory"><p class="eyebrow">MATCH COMPLETE</p><div class="victory-icon">${win===0?'◇':win===1?'◆':'＝'}</div><h1>${win<0?'引き分け':sideLabel(win)+'の勝利'}</h1><p>ターン${game.turn}で決着。両軍の行動は対戦ログから確認できます。</p><div class="victory-actions"><button class="primary-btn" data-act="again">同じ編成でもう一戦</button><button class="line-btn" data-act="new">編成を変更する</button></div><div class="victory-grid">${[0,1].map(s=>`<div><b>${sideLabel(s)}</b><span>生存者 ${alive(s).length}/6</span><span>手札 ${game.players[s].hand.length}枚</span></div>`).join('')}</div></section><div class="log-panel"><div class="boxheading"><h3>対戦ログ</h3></div><div class="log-list">${game.log.slice(0,65).map(v=>`<p>${escapeHTML(v)}</p>`).join('')}</div></div>`}
function renderCatalogue(){return `<section class="pagehead"><p class="eyebrow">CARD LIBRARY</p><h1>カード図鑑 <span>${CARD_DATA.length}</span></h1><p>新公式ソースのNo.1〜91と非公式No.1000〜1035、追加登録したカードを収録。各カードを選ぶと技ととくせいの原文を確認できます。</p></section><div class="catalog-grid">${CARD_DATA.map(c=>`<button class="catalog-card" data-act="detail" data-id="${c.id}"><div class="catalog-top"><span>No.${c.id}</span><span>${c.origin==='公式カード'?'OFFICIAL':c.userAdded?'ADDED':'UNOFFICIAL'}</span></div><div class="catalog-avatar">${iconFor(c)}</div><b>${escapeHTML(c.name)}</b><small>${escapeHTML(c.archetype)} · ${escapeHTML(c.role)}</small><div class="catalog-stats"><span>HP ${c.hp}</span><span>攻 ${c.attack}</span><span>防 ${c.defense}</span><span>速 ${c.speed}</span></div><div class="catalog-footer">${escapeHTML(c.traitName)} <span>→</span></div></button>`).join('')}</div>`}
function renderRules(){return `<section class="pagehead"><p class="eyebrow">BATTLE HANDBOOK</p><h1>ルールガイド</h1><p>「基本ルールとカードリスト」と36人のカード案に基づく、サイト内の裁定です。</p></section><div class="rules-grid"><article class="panel"><h2>01 / 勝敗と配置</h2><p>各プレイヤー6人を編成し、毎ターン最大3人が出場します。全6人が墓場に送られた側が敗北。ターン終了時に出場者全員が倒れている場合も敗北となります。</p></article><article class="panel"><h2>02 / 山札・手札</h2><p>各プレイヤーの山札は60枚です。「デッキ編成」でMPカード・7属性コストカード・11種類の補助カードを自由に配分できます。MPは1MP≧2MP≧3MPが必須。開始時5枚、毎ターン2枚ドロー。技は必要MPと属性カードを手札から捨てて使用します。捨て札は山札が尽きると再シャッフルできます。</p></article><article class="panel"><h2>03 / 攻撃・すばやさ</h2><p>攻撃威力が相手のぼうぎょ値以下なら最終的にも確定10ダメージ。超える場合は「威力−ぼうぎょ値」です。軽甲・重甲やダメージ−30の数値軽減があっても確定10は残ります。ただし「まほうの甲冑」のように攻撃そのものを完全に防ぐ効果では0になります。「確定ダメージ」はぼうぎょを無視します。行動順は現在のすばやさが高い順、同値はランダムです。</p></article><article class="panel"><h2>04 / 磁気波動</h2><p>敵1人に最大3枚。行動順終了時に1枚につき確定10ダメージ。3枚の上限を超えて付与する分は即座に確定10ダメージ。起爆技でも発動します。</p></article><article class="panel"><h2>05 / 軽甲と重甲</h2><p>アイリスの「二層防衛」で対戦開始時にベンチを含む味方6人全員が軽甲と重甲を各1枚保持。軽甲は被ダメ−15・すばやさ+10、重甲は被ダメ−35・すばやさ−10。両方あれば防御時に消費する装甲を選びます。</p></article><article class="panel"><h2>06 / 連撃</h2><p>連撃編成6人はそれぞれのとくせいで通常攻撃が「現在のこうげき値の35％（十の位へ四捨五入）×3回」になります。各発ごとにぼうぎょ値を計算し、各発を別々の攻撃として数えます。</p></article><article class="panel"><h2>07 / 状態異常</h2><p>やけど：ターン開始時に確定5ダメージ/段階と攻撃力への減算。どく：確定5ダメージ/段階と行動失敗確率。ねむり：行動不能（被弾で解除）。本編成で使わないみりょう等は一般図鑑ルールを参照してください。</p></article><article class="panel"><h2>08 / このサイトの簡易裁定</h2><p>MPは自動で最小超過になる組み合わせを消費。複数対象や「任意」の効果は自動選択する場合があります。1戦限定の補助カードや「確定先手」の事前宣言など一部には簡略化があります。オンライン通信対戦機能は含まれていません。</p></article></div>`}
function renderDetails(){if(config.showDetails==null)return '';let c=HERO_MAP[config.showDetails];if(!c)return '';return `<div class="veil"><section class="modal hero-detail"><div class="modal-title"><div><p class="eyebrow">UNIT NO.${c.id} · ${c.origin==='公式カード'?'OFFICIAL':c.userAdded?'ADDED':'UNOFFICIAL'}</p><h2>${escapeHTML(c.name)}</h2></div><button class="close-btn" data-act="closeDetail">×</button></div><p class="detail-archetype">${escapeHTML(c.faction)} / ${escapeHTML(c.archetype)} · ${escapeHTML(c.role)}</p><p>${escapeHTML(c.desc)}</p><div class="detail-stats"><span><small>HP</small><b>${c.hp}</b></span><span><small>攻撃</small><b>${c.attack}</b></span><span><small>防御</small><b>${c.defense}</b></span><span><small>すばやさ</small><b>${c.speed}</b></span></div><div class="detail-section"><h3>とくせい：${escapeHTML(c.traitName)}</h3><p>${escapeHTML(c.trait)}</p></div>${c.skills.map(s=>`<div class="detail-section"><h3>${escapeHTML(s.name)} <span>${escapeHTML(s.costText||s.cost+'MP')}${s.special.length?' + '+escapeHTML(s.special.join('＋'))+'カード':''}</span></h3><p>${escapeHTML(s.desc)}</p></div>`).join('')}<button class="line-btn" data-act="closeDetail">閉じる</button></section></div>`}
function renderManualPanel(){if(!game?.manualPending||game.phase==='ended')return '';let pending=game.manualPending;let c=game.players.flatMap(x=>x.team).find(x=>x.uid===pending.actorUid);let living=game.players.flatMap(x=>x.team).filter(x=>x.hp>0);return `<div class="veil high"><section class="modal manual-modal"><div class="modal-title"><div><p class="eyebrow">MANUAL EFFECT RESOLUTION</p><h2>${escapeHTML(c?.name||'追加キャラクター')}：${escapeHTML(pending.skillName)}</h2></div></div><p class="manual-desc">${escapeHTML(pending.description)}</p><p class="muted">複雑な技の処理内容を確認し、必要な分だけ効果を反映してから「処理完了」を押してください。数値変更はぼうぎょを無視したHP直接操作です。</p><label>操作するキャラクター<select id="manualTarget">${living.map(x=>`<option value="${x.uid}" ${pending.targetUid===x.uid?'selected':''}>${x.side===0?'青':'赤'}｜${escapeHTML(x.name)}（HP ${x.hp}）</option>`).join('')}</select></label><label>数値（HP増減・ステータス・ドロー）<input id="manualAmount" type="number" min="0" max="9999" value="30"></label><div class="manual-action-grid">${[['damage','HPを減らす'],['heal','HPを回復'],['attack','攻撃＋'],['defense','防御＋'],['speed','素早さ＋'],['attack_down','攻撃−'],['defense_down','防御−'],['speed_down','素早さ−'],['charm','みりょう'],['burn','やけど'],['poison','どく'],['sleep','ねむり'],['confusion','こんらん'],['magnet','磁気波動'],['cure','異常解除'],['light','軽甲'],['heavy','重甲'],['draw','ドロー']].map(([op,label])=>`<button type="button" class="small-outline" data-act="manualEffect" data-op="${op}">${label}</button>`).join('')}</div><button class="primary-btn manual-finish" data-act="manualDone">手動処理を完了して次の行動へ</button></section></div>`}
function render(){let node=$('#app');if(!node)return;
 let body=config.view==='deck'?renderDeckEditor():config.view==='manage'?renderManager():config.view==='cards'?renderCatalogue():config.view==='rules'?renderRules():!game?renderSetup():game.phase==='ended'?renderVictory():game.phase==='select'?renderSelection():game.phase==='handoff'?'<section class="victory"><h2>プレイヤー交代</h2><p>端末を赤チームに渡してください。</p><button class="primary-btn" data-act="startP2">赤チームの配置を選択する</button></section>':renderBattle();
 // 対戦中はスマートフォンでも届く場所に新規対戦ボタンを常設する。
 // ヘッダー側と重複させないため、対戦画面では専用ツールバーに切り替える。
 const onGameScreen=config.view==='battle'&&!!game;
 const newBattleBar=onGameScreen?`<div class="new-battle-toolbar" role="group" aria-label="対戦操作"><span>${game.phase==='ended'?'対戦終了':`第${game.turn}ターン · 対戦中`}</span><button type="button" class="new-battle-action" data-act="new">＋ 新規対戦</button></div>`:'';
 const headerNewButton=onGameScreen?'':'<button class="header-reset" type="button" data-act="new">＋ 新規対戦</button>';
 node.innerHTML=`<header class="site-header"><div class="head-inner"><button class="brand" data-act="home"><span class="logo-mark">◇</span><span><b>売ってない TCG</b><small>VIVID ARMY // BATTLE ARENA</small></span></button><nav><button class="${config.view==='battle'?'active':''}" data-act="nav" data-view="battle">対戦</button><button class="${config.view==='deck'?'active':''}" data-act="nav" data-view="deck">デッキ編成</button><button class="${config.view==='cards'?'active':''}" data-act="nav" data-view="cards">カード図鑑</button><button class="${config.view==='rules'?'active':''}" data-act="nav" data-view="rules">ルール</button><button class="${config.view==='manage'?'active':''}" data-act="nav" data-view="manage">カード管理</button></nav>${headerNewButton}</div></header><main class="main-content">${newBattleBar}${body}</main><footer class="site-footer">FAN-MADE / NON-COMMERCIAL PROTOTYPE · Source: 基本ルールとカードリスト2 / 非公式36人<span>ローカル対戦 · 自動保存</span></footer>${renderEditor()}${renderDetails()}${renderManualPanel()}`}
function enterTarget(req){selected=req;if(req.targetType==='none'){if(req.kind==='assist')startAssist(req.side,req.label,null);else actSkill(req.source,req.skill,null);return}if(req.targetType==='self'){if(req.kind==='assist')startAssist(req.side,req.label,req.source);else actSkill(req.source,req.skill,req.source);return}render()}
async function handleAction(el){let a=el.dataset.act;if(!a)return;
 switch(a){case 'nav':config.view=el.dataset.view;if(config.view==='deck')openDeckEditor(deckEditSide,false);manageNotice='';render();return;
 case 'home':config.view='battle';render();return;
 case 'new':if(game&&game.phase!=='ended'&&!confirm('進行中の対戦を終了し、新規対戦を作成しますか？'))return;game=null;localStorage.removeItem(LSKEY);config.view='battle';selected=null;plannedChoices=[];passPending=false;config.showDetails=null;config.editorSide=null;render();return;
 case 'again':plannedChoices=[];startMatch();return;
 case 'mode':config.mode=el.dataset.val;saveConfig();render();return;
 case 'deckOpen':openDeckEditor(Number(el.dataset.side),true);render();return;
 case 'deckSide':openDeckEditor(Number(el.dataset.side),true);render();return;
 case 'deckStep':changeDeckCount(el.dataset.card,Number(el.dataset.delta));render();return;
 case 'deckAuto':deckDraft=deckRecommended(config.picks[deckEditSide]);deckNotice='チームに合わせて自動配分しました。保存すると次の対戦で使用されます。';render();return;
 case 'deckZero':if(!confirm('すべてのカード枚数を0枚にしますか？'))return;deckDraft=Object.fromEntries(DECK_CARD_TYPES.map(x=>[x,0]));deckNotice='枚数をリセットしました。';render();return;
 case 'deckSave':{let report=validateDeckCounts(deckDraft);if(!report.valid){deckNotice='保存できません：'+report.errors.join('／');render();return;}deckSlots[deckEditSide]=deckExpand(deckDraft);saveDeckSlots();deckNotice='保存しました。次の新規対戦からこの60枚デッキを使用します。';render();return}
 case 'deckReset':{if(!confirm('このチームのカスタムデッキを解除し、自動編成に戻しますか？'))return;deckSlots[deckEditSide]=null;saveDeckSlots();deckDraft=deckRecommended(config.picks[deckEditSide]);deckNotice='自動編成に戻しました。';render();return}
 case 'deckCopy':{let target=1-deckEditSide,report=validateDeckCounts(deckDraft);if(!report.valid){deckNotice='60枚の有効なデッキを作成してからコピーしてください。';render();return;}deckSlots[target]=deckExpand(deckDraft);saveDeckSlots();deckNotice=sideLabel(target)+'へ60枚の構成をコピーしました。';render();return}
 case 'deckExport':downloadData('売ってないTCG_保存デッキ.json',JSON.stringify({format:'uttenai-tcg-decks-v1',decks:deckSlots},null,2));return;
 case 'editor':config.editorSide=Number(el.dataset.side);queryText='';heroFilter='all';render();return;
 case 'closeEditor':if(config.picks[config.editorSide]?.length!==6)return;config.editorSide=null;saveConfig();render();return;
 case 'toggleHero':{let s=Number(el.dataset.side),id=Number(el.dataset.id),arr=config.picks[s];if(arr.includes(id))config.picks[s]=arr.filter(x=>x!==id);else if(arr.length<6)arr.push(id);else {alert('1チーム6人までです。外してから選んでください');return}saveConfig();render();return}
 case 'detail':config.showDetails=Number(el.dataset.id);render();return;
 case 'closeDetail':config.showDetails=null;render();return;
 case 'start':if(config.picks.some(x=>x.length!==6)){alert('両チーム6人ずつ選択してください');return}plannedChoices=[];startMatch();return;
 case 'pick':{let uid=el.dataset.uid;if(plannedChoices.includes(uid)){plannedChoices=plannedChoices.filter(u=>u!==uid)}else if(plannedChoices.length<3)plannedChoices.push(uid);else alert('出場できるのは3人までです');render();return}
 case 'confirmLineup':{let chosen=plannedChoices.slice();plannedChoices=[];commitSelection(game.currentSelectSide,chosen);return}
 case 'startP2':game.phase='select';game.currentSelectSide=1;plannedChoices=[];render();return;
 case 'resume':passPending=false;render();return;
 case 'chooseNormal':{let h=game.players[game.current.side].team.find(x=>x.uid===game.current.uid);enterTarget({kind:'normal',source:h,side:game.current.side,targetType:'enemy',label:'通常攻撃'});return}
 case 'chooseSkill':{let h=game.players[game.current.side].team.find(x=>x.uid===game.current.uid);let i=Number(el.dataset.skill);if(!getPayment(game.current.side,HERO_MAP[h.id].skills[i]))return;enterTarget({kind:'skill',source:h,side:game.current.side,skill:i,targetType:(TARG[h.id]?.[i]||HERO_MAP[h.id].skills[i].target||'enemy'),label:HERO_MAP[h.id].skills[i].name});return}
 case 'chooseAssist':{let s=game.current.side,name=el.dataset.name;enterTarget({kind:'assist',side:s,label:name,targetType:targetOfAssist(name)});return}
 case 'target':{if(!selected||waiting)return;let target=game.players.flatMap(p=>p.team).find(x=>x.uid===el.dataset.uid);if(!target||target.hp<=0)return;let req=selected;
 let okay=req.targetType==='enemy'&&ownerOf(target)!==req.side||req.targetType==='ally'&&ownerOf(target)===req.side||req.targetType==='self'&&req.source.uid===target.uid;
 if(!okay)return;if(req.kind==='normal')await actNormal(req.source,target);else if(req.kind==='skill')await actSkill(req.source,req.skill,target);else startAssist(req.side,req.label,target);return}
 case 'cancelTarget':selected=null;render();return;
 case 'passAction':{if(!game.current||waiting)return;let h=game.players[game.current.side].team.find(x=>x.uid===game.current.uid);if(h){selected=null;log(`${h.name}は行動をパス`);endAction(h)}return}
 case 'manageTab':managePanel=el.dataset.val;if(managePanel==='edit'&&!editingCard)editingCard=makeBlankCard();render();return;
 case 'newCard':editingCard=makeBlankCard();managePanel='edit';manageNotice='';render();return;
 case 'editUser':editingCard=JSON.parse(JSON.stringify(USER_CARDS.find(c=>c.id===Number(el.dataset.id))));managePanel='edit';render();return;
 case 'deleteUser':{let id=Number(el.dataset.id);if(!confirm('No.'+id+' の追加カードを削除しますか？'))return;deleteUserCard(id);render();return}
 case 'addSkill':{let rows=$('#manageSkillRows');if(rows){rows.insertAdjacentHTML('beforeend',manageSkillRow({name:'',cost:2,special:[],desc:'',target:'enemy',effect:{type:'damage',value:60}},rows.children.length));}return}
 case 'removeSkill':{let item=el.closest('.skill-edit');if(item)item.remove();document.querySelectorAll('.skill-order').forEach((n,i)=>n.textContent=i+1);return}
 case 'importOfficial':config.view='cards';render();return;
 case 'importText':{try{pasteDraft=$('#pasteCardText')?.value||'';let {cards,warnings}=parseOfficialText(pasteDraft);if(!confirm(cards.length+'枚を登録します。技の複雑な効果は手動裁定になります。続けますか？'))return;commitUserCards(cards);manageNotice+=' '+(warnings.length?warnings.slice(0,4).join('／'):'');render()}catch(e){alert(e.message)}return}
 case 'exportCards':downloadData('売ってないTCG_追加カード.json',JSON.stringify(USER_CARDS,null,2));return;
 case 'openManualTools':{if(!game.current||waiting)return;let h=game.players[game.current.side].team.find(x=>x.uid===game.current.uid);game.manualPending={actorUid:h.uid,skillName:'カード効果の手動裁定',description:HERO_MAP[h.id].trait||'必要に応じて効果を画面で反映してください。',targetUid:h.uid,consumeAction:false};render();return}
 case 'manualEffect':{let id=$('#manualTarget')?.value,amt=$('#manualAmount')?.value;applyManualChange(el.dataset.op,id,amt);return}
 case 'manualDone':finishManual();return;
 case 'armor':{let fn=armoredResolver;armoredResolver=null;game.pendingArmor=null;render();if(fn)fn(el.dataset.kind);return}
 }
}
function handleForm(el){let a=el.dataset.act;if(a==='deckCount'){changeDeckAbsolute(el.dataset.card,el.value);render();return;}if(a==='formation'){let f=FORMATIONS.find(x=>x.key===el.value);if(f){config.picks[Number(el.dataset.side)]=f.ids.slice();saveConfig();render()}}
 if(a==='manageSearch'){manageSearch=el.value;render();let e=document.querySelector('[data-act=manageSearch]');if(e){e.focus();e.setSelectionRange(manageSearch.length,manageSearch.length)}}
 if(a==='search'){let pos=el.selectionStart;queryText=el.value;render();let input=$('#heroSearch');if(input){input.focus();input.setSelectionRange(pos,pos)}}
 if(a==='filter'){heroFilter=el.value;render()}}
const oldNextActor=nextActor;nextActor=function(){let prev=game?.current?.side;oldNextActor();let now=game?.current?.side;if(game?.mode==='local'&&game.phase==='acting'&&now!==null&&now!==prev&&prev!==undefined){passPending=true;render()}};
document.addEventListener('click',ev=>{let e=ev.target.closest('[data-act]');if(!e)return;if(e.dataset.act==='search'||e.dataset.act==='filter'||e.dataset.act==='formation')return;handleAction(e).catch(err=>{console.error(err);alert('処理中にエラーが発生しました：'+err.message);waiting=false;render()})});
document.addEventListener('input',ev=>{if(['search','manageSearch'].includes(ev.target.dataset.act))handleForm(ev.target)});
document.addEventListener('change',ev=>{if(['filter','formation','deckCount'].includes(ev.target.dataset.act))handleForm(ev.target)});
document.addEventListener('submit',ev=>{if(!ev.target.matches('#cardManageForm'))return;ev.preventDefault();try{let c=captureManageForm();commitUserCards([c]);editingCard=null;managePanel='list';render()}catch(e){alert('登録できません：'+e.message)}});
document.addEventListener('change',async ev=>{let a=ev.target.dataset.act;if(a==='importTextFile'){let file=ev.target.files?.[0];if(file){pasteDraft=await file.text();managePanel='import';manageNotice='TXTファイルを読み込みました。内容を確認して「本文から取り込む」を押してください。';render()}}else if(a==='deckImportFile'){let file=ev.target.files?.[0];if(file)try{let parsed=JSON.parse(await file.text());importDeckFile(parsed);render()}catch(e){deckNotice='取り込み失敗：'+e.message;render()}}else if(a==='importJsonFile'){let file=ev.target.files?.[0];if(file)try{let data=JSON.parse(await file.text());let cards=Array.isArray(data)?data:data.cards;if(!Array.isArray(cards))throw Error('JSON配列または {cards: [...]} の形式で指定してください');if(!confirm(cards.length+'枚のJSONカードを登録しますか？'))return;commitUserCards(cards);managePanel='list';render()}catch(e){alert('JSON取り込み失敗：'+e.message)}}});
initDeckBuilder();restore();render();
</script></body></html>
